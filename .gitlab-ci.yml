stages:
  - test

agent-tests:
  stage: test
  image: python:3.12
  cache:
    key:
      files:
        - agent/requirements-dev.txt
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - cd agent
  script:
    - pip install -r requirements-dev.txt
    - pytest -v
